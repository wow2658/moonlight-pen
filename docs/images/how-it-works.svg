 <circle cx="1501" cy="468" r="5" fill="#128575"/><text x="1104" y="723" font-size="23" fill="#657789" style="fill:#657789">필압으로 선 굵기 · 진하기 조절</text><text x="650" y="427" font-size="31" fill="#128575" style="fill:#128575" font-weight="700">펜 입력 전달</text><path d="M580 463L1000 463" stroke="#128575" stroke-width="6" marker-end="url(#teal)"/><text x="607" y="511" font-size="25" fill="#657789" style="fill:#657789">필압 · 기울기 · 지우개</text><text x="660" y="581" font-size="31" fill="#5982d8" style="fill:#5982d8" font-weight="700">화면과 소리</text><path d="M1019 617L600 617" stroke="#5982d8" stroke-width="6" marker-end="url(#blue)"/><text x="646" y="665" font-size="24" fill="#657789" style="fill:#657789">PC 화면을 노트북에 표시</text><rect x="44" y="790" width="484" height="207" rx="24" fill="white"/><text x="70" y="841" font-size="29" font-weight="700">S펜 70% → 100%</text><text x="70" y="891" font-size="24" fill="#657789" style="fill:#657789">너무 세게 누르지 않도록</text><text x="70" y="933" font-size="24" fill="#657789" style="fill:#657789">도달 압력과 감도를 조절</text><rect x="558" y="790" width="484" height="207" rx="24" fill="white"/><text x="584" y="841" font-size="29" font-weight="700">PTH-451도 노트북에 연결</text><text x="584" y="891" font-size="24" fill="#657789" style="fill:#657789">Windows Ink로 필압 전달</text><text x="584" y="933" font-size="24" fill="#657789" style="fill:#657789">기기별 설정을 따로 저장</text><rect x="1072" y="790" width="484" height="207" rx="24" fill="white"/><text x="1098" y="841" font-size="29" font-weight="700">화면 전환도 패널에서</text><text x="1098" y="891" font-size="24" fill="#657789" style="fill:#657789">모니터 선택 · 복제 · 확장</text><text x="1098" y="933" font-size="24" fill="#657789" style="fill:#657789">복제·확장은 호스트 설치 필요</text><text x="47" y="1043" font-size="21" fill="#657789" style="fill:#657789">연결 구조 설명도 · 실제 앱 화면 캡처가 아닙니다.</text><rect x="44" y="1081" width="1512" height="192" rx="24" fill="white"/><text x="72" y="1124" font-size="28" font-weight="700">만들게 된 이유: 필압을 쓰기 위한 준비가 너무 번거로웠습니다.</text><text x="72" y="1172" font-size="25" fill="#657789" style="fill:#657789">기존 우회: Tailscale + VirtualHere까지 따로 연결하고 설정</text><text x="72" y="1217" font-size="25" fill="#128575" style="fill:#128575" font-weight="700">수정 목표: Moonlight + Sunshine 안에서 필압 전달과 보정을 해결</text></svg>